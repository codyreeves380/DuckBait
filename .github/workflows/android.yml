name: Android CI/CD

on:
  push:
    branches: [ "main" ] # Triggers build every time you save your code
  workflow_dispatch: # Allows you to manually click "Build" on your phone

jobs:
  build:
    runs-on: ubuntu-latest # Spins up a free Linux virtual machine

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4 # Grabs your repository files

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
           gradle-version: '9.8.2'

    - name: Build Debug APK
      run: gradle assembleDebug # Uses the runner's pre-installed system Gradle directly

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DocumentGenerator-APK
        path: "**/build/outputs/apk/debug/*-debug.apk" # Double asterisks wildcards search everywhere for the APK file automatically
